[package]
name = "libflatpakcli"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A CLI for flatpak with machine readable output, to be used instead of libflatpak for languages that don't have a libflatpak binding."

[dependencies]
clap = { version = "4.6.1" , features = ["derive"] }
libflatpak = "0.7.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
